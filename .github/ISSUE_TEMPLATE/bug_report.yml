name: Bug report
description: Something in the CLI, validator, or site does not work as documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste secrets, tokens, or private repository contents.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SkillForge version or commit
    validations:
      required: true
  - type: input
    id: opencode
    attributes:
      label: opencode version
      placeholder: "1.19.4"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "24.15.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI install/add
        - Validator
        - Scaffold
        - Visibility / commands
        - Website
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs or context
      description: Redact paths, tokens, and private data.
    validations:
      required: false
